<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wise cats - quotes by famous kitties</title>
  <!-- Länk till stylesheet -->
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">

<body>
  <!-- Add your site or application content here -->
  <div class="header">
  </div>
  <h1>🐱 Wise cats 🐱</h1>
  <p>Whenever you need guidance in life, we're here for you.</p>

  <!-- Knapp för Get wisdom-funktion och divar att lägga innehåll i via app.js-->
  <button id="generate">Get wisdom</button>
  <div id="catPic"></div>
  <div id="randomQuote"></div>
  <div id="author"></div>

  <h2>Search depending on theme:</h2>
  <p>Need more specific inspiration? Choose a theme that feels ~right~ and get wisdom tailored to your needs.</p>
  <!-- Dropdown-meny för att välja tema, knapp för att söka och divar att lägga innehåll i -->
  <select id="mood">
    <option value="anxiety">anxiety</option>
    <option value="courage">courage</option>
    <option value="change">change</option>
    <option value="forgiveness">forgiveness</option>
    <option value="future">future</option>
    <option value="life">life</option>
  </select>
  <button id="generateSpecific">Search wisdom</button>
  <div id="themeQuote"></div>

  <h2>Search quotes by name:</h2>
  <!-- Sökfält och knapp för att söka
  div för att visa tre kort från start och sen kort baserat på sökningen -->
  <p>Find your favorite wise cat.</p>
  <input id="searchInput" type="text" placeholder="Search for name...">
  <button id="searchBtn">Search</button>
  <div id="searchResults" class="grid"></div>

  <!-- Koppling till config-fil som innehåller API-nyckel (som jag sedan inte använde...)
  samt app.js -->

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
